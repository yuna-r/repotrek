[package]
name = "repotrek"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
authors = ["Yuna <youzhilinqi@gmail.com>"]
description = "A terminal-first GitHub source browser for reading repositories deeply"
license = "MIT"
repository = "https://github.com/yuna-r/repotrek"
readme = "README.md"
keywords = ["github", "tui", "source-code", "repository", "browser"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
