name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            id: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: repotrek
            archive: repotrek-linux-x86_64.tar.gz
            windows: false

          - name: Linux ARM64
            id: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: repotrek
            archive: repotrek-linux-aarch64.tar.gz
            windows: false

          - name: macOS Apple Silicon
            id: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            binary: repotrek
            archive: repotrek-macos-aarch64.tar.gz
            windows: false

          - name: macOS Intel
            id: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: repotrek
            archive: repotrek-macos-x86_64.tar.gz
            windows: false

          - name: Windows x86_64
            id: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: repotrek.exe
            archive: repotrek-windows-x86_64.zip
            windows: true

          - name: Windows ARM64
            id: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: repotrek.exe
            archive: repotrek-windows-aarch64.zip
            windows: true

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Test
        run: cargo test --all-features --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Package Unix archive
        if: ${{ !matrix.windows }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/repotrek
          chmod +x package/repotrek
          cp README.md README.ja.md CHANGELOG.md LICENSE package/
          tar -C package -czf "${{ matrix.archive }}" .

      - name: Package Windows archive
        if: ${{ matrix.windows }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "package/repotrek.exe"
          Copy-Item README.md, README.ja.md, CHANGELOG.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}" -Force

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.id }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach assets to GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all packaged binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum repotrek-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "RepoTrek ${{ github.ref_name }}" \
            --generate-notes
