name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: repotrek
            archive: repotrek-linux-x86_64.tar.gz

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: repotrek
            archive: repotrek-linux-aarch64.tar.gz

          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            binary: repotrek
            archive: repotrek-macos-aarch64.tar.gz

          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: repotrek
            archive: repotrek-macos-x86_64.tar.gz

          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: repotrek.exe
            archive: repotrek-windows-x86_64.zip

          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: repotrek.exe
            archive: repotrek-windows-aarch64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/repotrek" dist/
          cp README.md README.ja.md LICENSE dist/

          tar -C dist -czf "${{ matrix.archive }}" .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item "target/${{ matrix.target }}/release/repotrek.exe" dist/
          Copy-Item README.md dist/
          Copy-Item README.ja.md dist/
          Copy-Item LICENSE dist/

          Compress-Archive `
            -Path dist/* `
            -DestinationPath "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release-assets
        run: sha256sum repotrek-* > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --repo "${{ github.repository }}" \
            --title "RepoTrek ${{ github.ref_name }}" \
            --generate-notes
